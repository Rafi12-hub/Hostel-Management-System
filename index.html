<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      viewport-fit=cover lets env(safe-area-inset-*) resolve on notched phones.
      The layout viewport can therefore extend under the system status bar, and
      sticky/fixed top chrome MUST offset with env(safe-area-inset-top) — handled
      by the `pt-safe` helper on every sticky/fixed header.
    -->
    <meta name="theme-color" content="#312e81" />
    <meta name="description" content="RGM Hostel Management Portal – rooms, mess, attendance, leave & more" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      opaque `default` (not black-translucent): in standalone iOS mode the
      system reserves its own status bar and the app UI starts BELOW it. The
      native bar is never hidden and never overlaps the app header.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RGM Hostel" />
    <title>RGM Hostel Portal</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
